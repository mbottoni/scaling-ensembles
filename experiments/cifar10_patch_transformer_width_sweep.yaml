name: cifar10-patch-transformer-width-sweep
output_dir: outputs/cifar10-patch-transformer-width-sweep

data:
  name: CIFAR10
  root: data
  batch_size: 128
  eval_batch_size: 512
  num_workers: 0
  # Pilot setting. Remove these limits for paper-grade runs.
  train_subset: 10000
  eval_subset: 2000

model:
  # DiT-inspired patch-token transformer adapted to classification so it can
  # reuse the same function-similarity metrics as the MLP/CNN experiments.
  architecture: patch_transformer
  widths: [64, 128, 256]
  hidden_layers: 4
  patch_size: 4
  num_heads: 4
  dropout: 0.1

training:
  epochs: 5
  seeds: [0, 1, 2]
  device: mps
  optimizer:
    lr: 0.001
    weight_decay: 0.0001

similarity:
  max_pairs_per_width:
  interpolation_steps: 11
