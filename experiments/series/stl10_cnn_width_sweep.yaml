name: stl10-cnn-width-sweep
output_dir: outputs/series/stl10-cnn-width-sweep

data:
  name: STL10
  root: data
  batch_size: 128
  eval_batch_size: 256
  num_workers: 0

model:
  architecture: cnn
  widths: [16, 32, 64, 128]
  hidden_layers: 2
  activation: relu

training:
  epochs: 30
  seeds: [0, 1, 2]
  device: mps
  optimizer:
    lr: 0.001
    weight_decay: 0.0001

similarity:
  max_pairs_per_width:
  interpolation_steps: 11

cache:
  enabled: true
  reuse_checkpoints: true
  reuse_logits: true
  force_retrain: false
