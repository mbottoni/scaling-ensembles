name: series-cifar10-cnn-blur-eval
output_dir: outputs/series/cifar10-cnn-blur-eval

data:
  name: CIFAR10
  root: data
  batch_size: 128
  eval_batch_size: 512
  num_workers: 0
  eval_variant: blur
  blur_kernel_size: 3

model:
  architecture: cnn
  widths: [16, 32, 64, 128, 256]
  hidden_layers: 2
  activation: relu

training:
  epochs: 40
  seeds: [0, 1, 2, 3, 4]
  device: mps
  optimizer:
    lr: 0.001
    weight_decay: 0.0001

similarity:
  max_pairs_per_width:
  interpolation_steps: 11
