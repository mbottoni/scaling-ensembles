name: series-cifar10-patch-transformer-long-schedule
output_dir: outputs/series/cifar10-patch-transformer-long-schedule

data:
  name: CIFAR10
  root: data
  batch_size: 128
  eval_batch_size: 512
  num_workers: 0

model:
  architecture: patch_transformer
  widths: [64, 128, 256, 512]
  hidden_layers: 4
  patch_size: 4
  num_heads: 4
  dropout: 0.1

training:
  epochs: 40
  seeds: [0, 1, 2, 3, 4]
  device: mps
  optimizer:
    lr: 0.0005
    weight_decay: 0.0001

similarity:
  max_pairs_per_width:
  interpolation_steps: 11

tracking:
  mlflow_enabled: true
  tracking_uri: outputs/mlruns
  experiment_name: scaling-ensembles-series
  log_artifacts: true
  log_checkpoints: true
  log_logits: true
  log_environment: true
  use_mlflow_cache: true
