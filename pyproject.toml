[project]
name = "scaling-ensembles"
version = "0.1.0"
description = "Experiments for studying function-space similarity of neural network minima as parameter count scales"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "marimo>=0.10",
    "tqdm>=4.60",
]

[project.optional-dependencies]
tracking = [
    "mlflow>=2.0",
]

[project.scripts]
scaling-ensembles-train = "scaling_ensembles.train:main"
scaling-ensembles-sweep = "scaling_ensembles.sweep:main"
scaling-ensembles-paper-plots = "scaling_ensembles.paper_plots:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaling_ensembles"]
